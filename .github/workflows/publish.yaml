name: Publish
on:
  pull_request:
    types: [closed]
    branches:
      - main
  # Manual run on main: versions nothing new, but publishes any version that is
  # tagged in git and missing on npm (e.g. after a failed publish).
  workflow_dispatch:

# npm trusted publishing (OIDC): no npm token, npm trusts this workflow file instead
# (configured per package on npmjs.com -> Settings -> Trusted publishing).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: "Use pnpm"
      uses: pnpm/action-setup@v4

    - name: "Use NodeJS 24"
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Config git user
      run: |
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        git remote set-url origin https://${{ github.actor }}:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}

    # Installs proto + the moon version pinned in .prototools.
    - name: "Use moon"
      uses: moonrepo/setup-toolchain@v0

    # moon installs the dependencies (pnpm, frozen lockfile in CI) and builds
    # @dvdevcz/linters before the checks.
    - name: "Lint and typecheck"
      run: moon run root:lint root:typecheck

    - name: "Version and publish"
      run: moon run root:release
